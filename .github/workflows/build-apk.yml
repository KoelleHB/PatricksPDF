name: Build Android APK

on:
  push:
    branches: [main, master, feature/native-binary-resource-refactor]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PATRICKSPDF_VERSION_CODE: ${{ github.run_number }}
      PATRICKSPDF_VERSION_NAME: 1.0.${{ github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Run unit regression tests
        run: npm test

      # Validation only; fixture is public, retrieved transiently,
      # and deleted when the GitHub runner is discarded.
      - name: Verify public FRITZ!Box manual links (PDF.js and raw PDF)
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            'https://gzhls.at/blob/ldb/4/8/9/a/c64fb80cfa9dad3267f3619a3e1fa0bdfa50.pdf' \
            --output "$RUNNER_TEMP/fritz-manual.pdf"
          test "$(stat -c%s "$RUNNER_TEMP/fritz-manual.pdf")" -gt 1000000
          PUBLIC_MANUAL_PATH="$RUNNER_TEMP/fritz-manual.pdf" \
            node --import tsx --test test/publicFritzLinks.test.ts

      - name: Browser smoke-test actual PDF link extraction
        run: |
          cp "$RUNNER_TEMP/fritz-manual.pdf" public/__public_fritz_manual_ci.pdf
          npm run dev -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/vite.log" 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" || true; rm -f public/__public_fritz_manual_ci.pdf' EXIT
          sleep 4
          timeout 75s google-chrome --headless=new --no-sandbox --disable-dev-shm-usage \
            --disable-gpu --virtual-time-budget=45000 --dump-dom \
            'http://127.0.0.1:4173/test/browserLinkProbe.html' \
            > "$RUNNER_TEMP/link-probe.html" 2> "$RUNNER_TEMP/chrome-probe.err" || true
          echo "Browser link probe output:"
          grep -o '<pre id="pdf-link-probe"[^>]*>[^<]*' "$RUNNER_TEMP/link-probe.html" || true
          if ! grep -q 'id="pdf-link-probe" data-status="pass"' "$RUNNER_TEMP/link-probe.html"; then
            echo "Browser PDF link extraction integration failed"
            tail -15 "$RUNNER_TEMP/chrome-probe.err" || true
            exit 1
          fi

      - name: Build Web App
        run: npm run build

      - name: Sync with Capacitor Android
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Detect release credentials
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release signing secrets not complete; producing debug APK only."
          fi

      - name: Restore temporary release keystore
        if: steps.signing.outputs.configured == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/patrickspdf-release.jks"
          test -s "$RUNNER_TEMP/patrickspdf-release.jks"

      - name: Build signed release APK
        if: steps.signing.outputs.configured == 'true'
        working-directory: ./android
        env:
          PATRICKSPDF_KEYSTORE_PATH: ${{ runner.temp }}/patrickspdf-release.jks
          PATRICKSPDF_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          PATRICKSPDF_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          PATRICKSPDF_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace --warning-mode all

      - name: Verify release APK signature and metadata
        if: steps.signing.outputs.configured == 'true'
        env:
          EXPECTED_VERSION_CODE: ${{ github.run_number }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -E "package: name='com.patrickspdf.app' versionCode='$EXPECTED_VERSION_CODE' "

      - name: Upload signed release APK
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: PatricksPDF-release-v1.0.${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build debug APK (until release secrets are installed)
        if: steps.signing.outputs.configured != 'true'
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Upload debug APK
        if: steps.signing.outputs.configured != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: PatricksPDF-debug-v1.0.${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/patrickspdf-release.jks"

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-build-reports
          path: |
            android/app/build/reports/
            android/build/
