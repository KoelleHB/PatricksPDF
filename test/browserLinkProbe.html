<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Synthetic encrypted PDF link integration smoke</title></head>
<body>
<pre id="pdf-link-probe" data-status="running">RUNNING</pre>
<script type="module">
import {loadPdfJsDoc} from '/src/utils/pdfDocumentLifecycle.ts';
import {extractPageLinks} from '/src/utils/pdfEngine.ts';
import {PDFDocument, PDFName, PDFString} from 'pdf-lib';
const out=document.getElementById('pdf-link-probe');
try {
  const response=await fetch('/test/fixtures/encrypted-pdf-links.pdf');
  if (!response.ok) throw new Error('Synthetic fixture unavailable');
  const bytes=await response.arrayBuffer();
  const doc=await loadPdfJsDoc(bytes);
  const annotations=await (await doc.getPage(1)).getAnnotations({intent:'display'});
  const processed=await extractPageLinks(bytes,1);
  const first=annotations.find(a=>a.dest)?.dest;
  const ref=Array.isArray(first)?first[0]:null;
  const targetIdx=ref&&typeof ref==='object'?await doc.getPageIndex(ref):-1;
  const result={
    pages:doc.numPages,
    rawAnnotations:annotations.filter(a=>a.subtype==='Link').length,
    processedLinks:processed.length,
    rawDest:annotations.filter(a=>Boolean(a.dest)).length,
    rawUrl:annotations.filter(a=>Boolean(a.url)).length,
    targetIdx,
    hasInternal:processed.some(link=>link.targetPage===2),
    hasExternal:processed.some(link=>link.url==='https://example.org/docs'),
  };
  // Buttons carrying navigation actions are widgets, not Link annotations.
  const synthetic=await PDFDocument.create();
  const source=synthetic.addPage([300,400]);
  const target=synthetic.addPage([300,400]);
  const form=synthetic.getForm();
  const internal=form.createButton('internal');
  internal.addToPage('internal',source,{x:20,y:100,width:80,height:20});
  internal.acroField.getWidgets()[0].dict.set(PDFName.of('A'),synthetic.context.obj({S:'GoTo',D:[target.ref,'Fit']}));
  const external=form.createButton('external');
  external.addToPage('external',source,{x:20,y:150,width:80,height:20});
  external.acroField.getWidgets()[0].dict.set(PDFName.of('A'),synthetic.context.obj({S:'URI',URI:PDFString.of('https://example.org/form')}));
  const syntheticBytes=await synthetic.save();
  const widgetLinks=await extractPageLinks(syntheticBytes.buffer,1);
  result.widgetInternal=widgetLinks.some(link=>link.targetPage===2);
  result.widgetExternal=widgetLinks.some(link=>link.url==='https://example.org/form');
  out.dataset.status=result.pages===2 &&
    result.rawAnnotations===2 && result.processedLinks===2 &&
    result.rawDest===1 && result.rawUrl===1 &&
    result.targetIdx===1 && result.hasInternal && result.hasExternal &&
    result.widgetInternal && result.widgetExternal
      ? 'pass':'fail';
  out.textContent=JSON.stringify(result);
} catch(error) {
  out.dataset.status='error';
  out.textContent=String(error?.message??error);
}
</script>
</body>
</html>
