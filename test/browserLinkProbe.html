<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Synthetic encrypted PDF link integration smoke</title></head>
<body>
<pre id="pdf-link-probe" data-status="running">RUNNING</pre>
<script type="module">
import {loadPdfJsDoc} from '/src/utils/pdfDocumentLifecycle.ts';
import {extractPageLinks, extractPdfFormFields} from '/src/utils/pdfEngine.ts';
import {PDFDocument, PDFName, PDFString} from 'pdf-lib';
import {embedSignaturesIntoPdf} from '/src/utils/pdfExportEngine.ts';
const out=document.getElementById('pdf-link-probe');
try {
  const response=await fetch('/test/fixtures/encrypted-pdf-links.pdf');
  if (!response.ok) throw new Error('Synthetic fixture unavailable');
  const bytes=await response.arrayBuffer();
  const doc=await loadPdfJsDoc(bytes);
  const annotations=await (await doc.getPage(1)).getAnnotations({intent:'display'});
  const processed=await extractPageLinks(bytes,1);
  const first=annotations.find(a=>a.dest)?.dest;
  const ref=Array.isArray(first)?first[0]:null;
  const targetIdx=ref&&typeof ref==='object'?await doc.getPageIndex(ref):-1;
  const result={
    pages:doc.numPages,
    rawAnnotations:annotations.filter(a=>a.subtype==='Link').length,
    processedLinks:processed.length,
    rawDest:annotations.filter(a=>Boolean(a.dest)).length,
    rawUrl:annotations.filter(a=>Boolean(a.url)).length,
    targetIdx,
    hasInternal:processed.some(link=>link.targetPage===2),
    hasExternal:processed.some(link=>link.url==='https://example.org/docs'),
  };
  // Buttons carrying navigation actions are widgets, not Link annotations.
  const synthetic=await PDFDocument.create();
  const source=synthetic.addPage([300,400]);
  const target=synthetic.addPage([300,400]);
  const form=synthetic.getForm();
  const internal=form.createButton('internal');
  internal.addToPage('internal',source,{x:20,y:100,width:80,height:20});
  internal.acroField.getWidgets()[0].dict.set(PDFName.of('A'),synthetic.context.obj({S:'GoTo',D:[target.ref,'Fit']}));
  const external=form.createButton('external');
  external.addToPage('external',source,{x:20,y:150,width:80,height:20});
  external.acroField.getWidgets()[0].dict.set(PDFName.of('A'),synthetic.context.obj({S:'URI',URI:PDFString.of('https://example.org/form')}));
  const textField=form.createTextField('notes');
  textField.enableMultiline();
  textField.addToPage(source,{x:20,y:200,width:160,height:60});
  textField.setFontSize(12);
  const choice=form.createDropdown('choice');
  choice.addOptions(['First','Second']);
  choice.addToPage(source,{x:20,y:280,width:100,height:20});
  choice.select('Second');
  const emptyChoice=form.createDropdown('emptyChoice');
  emptyChoice.addOptions(['First','Second']);
  emptyChoice.addToPage(source,{x:140,y:280,width:100,height:20});
  const labeledChoice=form.createDropdown('labeledChoice');
  labeledChoice.addToPage(source,{x:140,y:320,width:100,height:20});
  labeledChoice.acroField.dict.set(PDFName.of('Opt'), synthetic.context.obj([
    [PDFString.of('code-a'), PDFString.of('Alpha')],
    [PDFString.of('code-b'), PDFString.of('Beta')],
  ]));
  labeledChoice.acroField.dict.set(PDFName.of('V'), PDFString.of('code-b'));
  const editableChoice=form.createDropdown('editableChoice');
  editableChoice.addOptions(['Alpha', 'Beta']);
  editableChoice.enableEditing();
  editableChoice.addToPage(source,{x:140,y:350,width:100,height:20});
  const multiChoice=form.createOptionList('multiChoice');
  multiChoice.addOptions(['Alpha','Beta','Gamma']);
  multiChoice.enableMultiselect();
  multiChoice.addToPage(source,{x:180,y:20,width:100,height:60});
  multiChoice.select(['Alpha','Gamma']);
  const syntheticBytes=await synthetic.save();
  const widgetLinks=await extractPageLinks(syntheticBytes.buffer,1);
  result.widgetInternal=widgetLinks.some(link=>link.targetPage===2);
  result.widgetExternal=widgetLinks.some(link=>link.url==='https://example.org/form');
  const extractedForm=await extractPdfFormFields(syntheticBytes.buffer);
  const notes=extractedForm.fields.find(field=>field.name==='notes');
  result.choiceValue=extractedForm.initialValues.choice==='Second';
  result.emptyChoice=extractedForm.initialValues.emptyChoice==='';
  const labeled=extractedForm.fields.find(field=>field.name==='labeledChoice');
  result.labeledChoice=extractedForm.initialValues.labeledChoice==='code-b' && labeled?.options?.[1]==='code-b' && labeled?.optionLabels?.[1]==='Beta';
  result.editableChoice=extractedForm.fields.find(field=>field.name==='editableChoice')?.editableChoice===true;
  result.multiChoice=JSON.stringify(extractedForm.initialValues.multiChoice)===JSON.stringify(['Alpha','Gamma']) && extractedForm.fields.find(field=>field.name==='multiChoice')?.multiSelect===true;
  result.formMultiline=notes?.multiline===true;
  result.formFontSize=Math.abs((notes?.fontSizePercent ?? 0)*300/100-12)<0.01;
  const saved=await embedSignaturesIntoPdf(syntheticBytes.buffer,[],[],{notes:'First line\nSecond line',multiChoice:['Beta','Gamma']});
  const reopened=await loadPdfJsDoc(saved.buffer.slice(saved.byteOffset,saved.byteOffset+saved.byteLength));
  const savedNotes=(await (await reopened.getPage(1)).getAnnotations({intent:'display'})).find(a=>a.fieldName==='notes');
  result.formRoundTrip=savedNotes?.fieldValue==='First line\nSecond line' && savedNotes.defaultAppearanceData?.fontSize===12;
  const savedMulti=(await (await reopened.getPage(1)).getAnnotations({intent:'display'})).find(a=>a.fieldName==='multiChoice');
  result.multiRoundTrip=JSON.stringify(savedMulti?.fieldValue)===JSON.stringify(['Beta','Gamma']);
  const cleared=await embedSignaturesIntoPdf(syntheticBytes.buffer,[],[],{multiChoice:[]});
  const clearedDoc=await loadPdfJsDoc(cleared.buffer.slice(cleared.byteOffset,cleared.byteOffset+cleared.byteLength));
  const clearedMulti=(await (await clearedDoc.getPage(1)).getAnnotations({intent:'display'})).find(a=>a.fieldName==='multiChoice');
  result.multiClear=Array.isArray(clearedMulti?.fieldValue) && clearedMulti.fieldValue.length===0;
  out.dataset.status=result.pages===2 &&
    result.rawAnnotations===2 && result.processedLinks===2 &&
    result.rawDest===1 && result.rawUrl===1 &&
    result.targetIdx===1 && result.hasInternal && result.hasExternal &&
    result.widgetInternal && result.widgetExternal && result.formMultiline && result.formFontSize && result.formRoundTrip && result.choiceValue && result.emptyChoice && result.labeledChoice && result.editableChoice && result.multiChoice && result.multiRoundTrip && result.multiClear
      ? 'pass':'fail';
  out.textContent=JSON.stringify(result);
} catch(error) {
  out.dataset.status='error';
  out.textContent=String(error?.message??error);
}
</script>
</body>
</html>
