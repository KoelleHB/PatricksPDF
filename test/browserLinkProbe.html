<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Public PDF link integration smoke</title></head>
<body>
<pre id="pdf-link-probe" data-status="running">RUNNING</pre>
<script type="module">
import {loadPdfJsDoc} from '/src/utils/pdfDocumentLifecycle.ts';
import {extractPageLinks} from '/src/utils/pdfEngine.ts';
const out=document.getElementById('pdf-link-probe');
try {
  const response=await fetch('/__public_fritz_manual_ci.pdf');
  if (!response.ok) throw new Error('Public manual download unavailable');
  const bytes=await response.arrayBuffer();
  const doc=await loadPdfJsDoc(bytes);
  const raw2=await (await doc.getPage(2)).getAnnotations({intent:'display'});
  const raw14=await (await doc.getPage(14)).getAnnotations({intent:'display'});
  const result2=await extractPageLinks(bytes,2);
  const result14=await extractPageLinks(bytes,14);
  const raw2After=await (await doc.getPage(2)).getAnnotations({intent:'display'});
  const raw14After=await (await doc.getPage(14)).getAnnotations({intent:'display'});
  const dest=raw2.find(a=>a.dest)?.dest;
  const ref=Array.isArray(dest)?dest[0]:null;
  const targetIdx=ref&&typeof ref==='object'?await doc.getPageIndex(ref):-1;
  const result={
    raw2:raw2.filter(a=>a.subtype==='Link').length,
    raw14:raw14.filter(a=>a.subtype==='Link').length,
    result2:result2.length,
    result14:result14.length,
    targetIdx,
    raw2After:raw2After.filter(a=>a.subtype==='Link').length,
    raw14After:raw14After.filter(a=>a.subtype==='Link').length,
    result2FirstPage:result2[0]?.targetPage??null,
    result14FirstUrl:result14[0]?.url?.startsWith('https://')??false,
  };
  out.textContent=JSON.stringify(result);
  out.dataset.status=
    result.raw2>=50 && result.raw14>=5 &&
    result.result2>=50 && result.result14>=5 ? 'pass':'fail';
} catch(error) {
  out.dataset.status='error';
  out.textContent=String(error?.message??error);
}
</script>
</body>
</html>
